<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="stylesheet" href="apps/lib/app_world_ui.css">
  <link rel="stylesheet" href="開発/exam.css">
  <title>みづの 大学受験 問題集</title>
  <script defer src="開発/schedule.js"></script>
  <script defer src="開発/views/fc_tex.view.js"></script>
  <script defer src="開発/views/fc_enExamples.view.js"></script>
  <script defer src="開発/views/speed_reading.view.js"></script>
  <script defer src="開発/views/flash_mental_math.view.js"></script>
  <script defer src="開発/views/rpg_vocabulary.view.js"></script>
  <script defer src="開発/views/rpg_status.view.js"></script>
  <script defer src="開発/exam.js"></script>
</head>
<body>
  <header class="toolbar">
    <h1 id="heading">みづの 大学受験 問題集</h1>
    <button class="glass-icon world-glass-thin" id="questionsButton" type="button" aria-label="出題に戻る" title="出題に戻る" aria-controls="questions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l-6 6 6 6M4 12h16"/></svg>
    </button>
    <button class="glass-icon world-glass-thin" id="characterButton" type="button" aria-label="キャラ画面" title="キャラ画面" aria-expanded="false" aria-controls="characterPanel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 20v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/></svg>
    </button>
  </header>
  <main>
    <section id="characterPanel" hidden aria-label="キャラ画面"></section>
    <section id="questions" aria-label="出題">
      <p id="empty" role="status" hidden>キャラステータスの出題率を1以上にすると、出題を開始できます。</p>
    </section>
  </main>
</body>
</html>
