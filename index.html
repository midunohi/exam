<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="stylesheet" href="開発/exam.css">
  <title>みづの 大学受験 問題集</title>
  <script defer src="開発/schedule.js"></script>
  <script defer src="開発/views/fc_tex.view.js"></script>
  <script defer src="開発/views/fc_enExamples.view.js"></script>
  <script defer src="開発/views/speed_reading.view.js"></script>
  <script defer src="開発/views/flash_mental_math.view.js"></script>
  <script defer src="開発/views/rpg_vocabulary.view.js"></script>
  <script defer src="開発/views/rpg_status.view.js"></script>
  <script defer src="開発/exam.js"></script>
</head>
<body>
  <header class="toolbar">
    <h1 id="heading">みづの 大学受験 問題集</h1>
    <button id="ratesButton" type="button" aria-label="出題率" title="出題率" aria-expanded="false" aria-controls="ratesPanel">⚙</button>
    <button id="characterButton" type="button" aria-label="キャラ画面" title="キャラ画面" aria-expanded="false" aria-controls="characterPanel">👤</button>
    <a href="https://github.com/midunohi/exam" target="_blank" rel="noopener" aria-label="GitHub">GitHub ↗</a>
  </header>
  <main>
    <section id="ratesPanel" hidden aria-labelledby="ratesHeading">
      <h2 id="ratesHeading">出題率</h2>
      <p>0は出題なし。倍率は各形式の出やすさの比です。</p>
      <div id="rates"></div>
    </section>
    <section id="characterPanel" hidden aria-label="キャラ画面"></section>
    <section id="questions" aria-label="出題">
      <p id="empty" role="status" hidden>出題率を1以上にすると出題を開始します。</p>
    </section>
  </main>
</body>
</html>
